name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rebuild (e.g., v1.0.0+4)"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "17"

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*',
            '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Determine tag version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL_VERSION=$(echo "${{ github.event.inputs.tag }}" | sed 's/^v//')
          else
            FULL_VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "Building version $FULL_VERSION"

      # - name: Update pubspec.yaml with tag version
      #   run: |
      #     sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" pubspec.yaml
      #     cat pubspec.yaml | grep "^version:"

      - name: Install dependencies
        run: make install

      - name: Setup signing
        run: |
          mkdir -p /tmp/signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/signing/upload-keystore.jks
          echo "storeFile=/tmp/signing/upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASS }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> android/key.properties

      - name: Build AAB (App Bundle) for Play Store
        run: make bundle-android

      - name: Build APKs for GitHub Releases
        run: flutter build apk --release --split-per-abi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 5

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f android/key.properties
          rm -rf /tmp/signing

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: make install

      - name: Build IPA
        run: make build-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/ipa/lamp.ipa
          retention-days: 5

  release-github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-android
    permissions:
      contents: write

    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: artifacts/

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          allowUpdates: true

  deploy-play-store:
    name: Deploy to Google Play Store
    runs-on: ubuntu-latest
    needs: build-android

    steps:
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Ruby with caching
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/

      - name: Deploy to Play Store (Production)
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          fastlane supply \
            --track production \
            --release_status completed \
            --json_key_data "$GOOGLE_PLAY_JSON_KEY" \
            --package_name "com.github.sithengineer.lamp" \
            --aab build/app/outputs/bundle/release/app-release.aab

      - name: Clean up credentials
        if: always()
        run: rm -rf /tmp/play-store

  deploy-app-store:
    name: Deploy to Apple App Store
    runs-on: macos-latest
    needs: build-ios
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download IPA artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: build/ios/ipa/

      - name: Deploy to App Store (TestFlight)
        run: |
          echo "TODO: Configure App Store deployment"
          echo "Options: fastlane, Codemagic, or custom script"

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "17"

jobs:
  # Stage 1: Test & Lint
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: make install

      - name: Run linting
        run: make lint

      - name: Run tests
        run: make test

  # Stage 2: Build Android
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: make install

      - name: Setup signing
        run: |
          mkdir -p /tmp/signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/signing/upload-keystore.jks
          echo "storeFile=/tmp/signing/upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEYSTORE_PASS }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" >> android/key.properties

      - name: Build AAB (App Bundle)
        run: make bundle-android

      # Upload AAB artifact for deployment
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 5

      # Clean up sensitive files
      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f android/key.properties
          rm -rf /tmp/signing

  # Stage 3: Build iOS (requires macOS)
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test-and-lint
    # TODO: Set up Apple Developer certificate and provisioning profile for code signing
    # See: https://docs.flutter.dev/deployment/ios
    if: false # Temporarily disabled until code signing is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: make install

      - name: Build IPA
        run: make build-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/lamp.ipa
          retention-days: 5

  # Stage 4: Deploy to Play Store
  deploy-play-store:
    name: Deploy to Google Play Store
    runs-on: macos-latest
    needs: build-android
    # See: https://docs.flutter.dev/deployment/android#deploy-to-the-play-store
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/

      - name: Deploy to Play Store (Production)
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          fastlane supply \
            --track production \
            --release_status completed \
            --json_key_data "$GOOGLE_PLAY_JSON_KEY" \
            --aab build/app/outputs/bundle/release/app-release.aab

      - name: Clean up credentials
        if: always()
        run: rm -rf /tmp/play-store

  # Stage 5: Deploy to App Store (Manual trigger only)
  deploy-app-store:
    name: Deploy to Apple App Store
    runs-on: macos-latest
    needs: build-ios
    # TODO: Configure iOS code signing before enabling
    if: false # Disabled until iOS build is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/

      - name: Deploy to App Store (TestFlight)
        # TODO: Configure fastlane or Codemagic integration
        # For now, this is a placeholder
        run: |
          echo "TODO: Configure App Store deployment"
          echo "Options: fastlane, Codemagic, or custom script"

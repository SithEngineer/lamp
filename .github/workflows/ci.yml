name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "17"

jobs:
  # Stage 1: Test & Lint
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: make install

      - name: Run linting
        run: make lint

      - name: Run tests
        run: make test

  # Stage 2: Build Android
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install dependencies
        run: make install

      - name: Build APK
        run: make build-android

      # uncomment when build succeeds and we are ready to ship
      # - name: Upload APK artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: android-apk
      #     path: build/app/outputs/apk/release/app-release.apk
      #     retention-days: 5

  # Stage 3: Build iOS (requires macOS)
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test-and-lint
    # TODO: Set up Apple Developer certificate and provisioning profile for code signing
    # See: https://docs.flutter.dev/deployment/ios
    if: false # Temporarily disabled until code signing is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: make install

      - name: Build IPA
        run: make build-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/lamp.ipa
          retention-days: 5

  # Stage 4: Deploy to Play Store (Manual trigger only)
  deploy-play-store:
    name: Deploy to Google Play Store
    runs-on: ubuntu-latest
    needs: build-android
    # TODO: Set up Google Play API service account credentials
    # See: https://docs.flutter.dev/deployment/android#deploy-to-the-play-store
    if: false # Temporarily disabled

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/apk/release/

      - name: Deploy to Play Store (Internal Testing)
        # TODO: Configure fastlane or Codemagic integration
        # For now, this is a placeholder
        run: |
          echo "TODO: Configure Play Store deployment"
          echo "Options: fastlane, Codemagic, or custom script"

  # Stage 5: Deploy to App Store (Manual trigger only)
  deploy-app-store:
    name: Deploy to Apple App Store
    runs-on: macos-latest
    needs: build-ios
    # TODO: Configure iOS code signing before enabling
    if: false # Disabled until iOS build is configured

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/

      - name: Deploy to App Store (TestFlight)
        # TODO: Configure fastlane or Codemagic integration
        # For now, this is a placeholder
        run: |
          echo "TODO: Configure App Store deployment"
          echo "Options: fastlane, Codemagic, or custom script"
